follow_node:
  ros__parameters:
    # --- steering ---
    # Starting point is the car's own lane-following calibration
    # (ros_racer_calibration.yaml: Kp 0.2 / Ki 0.0 / Kd 0.1). Same servo, same
    # steering geometry, same actuator scale. The error SOURCE differs: a bbox
    # centre at ~12 fps is noisier than a lane centroid, so expect kd to want
    # lowering if the steering chatters. The D term is already low-passed.
    # RAISED from the lane-following 0.2 after measuring on the car: with x
    # normalised to +/-1 and steering clamped at +/-0.8, kp 0.2 meant a target at
    # the very edge of frame commanded only a quarter of the available steering
    # (measured: x=+0.455 -> steer=+0.078). The plant is the same as lane
    # following but the error signal's SCALE is not: a lane centroid deviates a
    # little, a tracked person can sit at the frame edge.
    kp_steer: 0.6
    ki_steer: 0.0
    kd_steer: 0.1
    steer_deadband: 0.05      # ignore <5% off-centre; stops hunting
    max_steer: 0.7            # inside the arbiter's 0.8 clamp

    # --- throttle ---
    standoff_mm: 1000.0       # provisional. Refine by measuring where detector
                              # confidence peaks, once testing on the ground.
    kp_throttle: 0.0004       # err is in mm: 1000 mm error -> 0.4, clamped to max
    kd_throttle: 0.0001
    throttle_deadband_mm: 150.0   # +/-15 cm counts as "at the standoff"
    # 0.365, not the measured 0.25 minimum. Magnus's call after driving it: 0.25
    # is where smoothness BEGINS, and sitting right on that edge leaves nothing
    # for the humps (carpet seams, a slight incline, a wheel catching). 0.365 also
    # lands on the class's own min_throttle, i.e. the slowest speed this platform
    # is calibrated to drive.
    #
    # Consequence: with a ceiling of 0.382 the throttle loop now has almost no
    # range to modulate within, so approach is effectively bang-bang: at speed,
    # or stopped in the deadband. The PD term barely matters for throttle now.
    # Steering is unaffected and still fully proportional.
    throttle_floor: 0.365      # MEASURED smooth floor. NOTE the consequence: the
                              # car cannot follow slowly. It moves at 0.25+ or it
                              # stops, so approach is stop-go rather than a gentle
                              # roll-in. The distance deadband is what makes that
                              # acceptable.
    max_throttle: 0.38        # the platform's calibrated ceiling
    allow_reverse: true       # back off if the target closes inside the standoff
    max_reverse: 0.382         # lower than max_throttle on purpose. Approaching and
                              # retreating are not symmetric: someone stepping
                              # toward the car makes a big negative error fast, and
                              # full-authority reverse there reads as bolting
                              # rather than yielding. Measured -0.24 before this cap.

    target_timeout_s: 0.5     # perception dying must not read as "target centred"

    debug_hz: 2.0             # log x, z, err, steer, throttle from one message.
                              # Set 0 for quiet running.
