safety_node:
  ros__parameters:
    # Which way the LiDAR thinks "forward" is. Mounting rotation is a physical
    # fact nobody writes down; find it with tools/lidar_sectors.py by putting an
    # object directly ahead and reading off the angle. Getting this wrong makes
    # the guard watch the wrong side of the car.
    forward_offset_deg: 0.0

    front_halfwidth_deg: 40.0
    rear_halfwidth_deg: 40.0

    # Front MUST stay inside the follow standoff (1.0 m). The person being
    # followed is an obstacle as far as the LiDAR is concerned, so a front
    # threshold at or above the standoff would deadlock the follow controller.
    front_stop_m: 0.45
    # Rear and sides can be tighter: the camera covers none of it, so this is the
    # only thing watching, but there is also no controller to conflict with.
    rear_stop_m: 0.35
    side_stop_m: 0.25

    # A single stray return must not stop the car. Spring-2023 Team 10
    # documented open areas producing phantom close points on this sensor class,
    # which made their robot freeze in place.
    min_points: 3

    publish_hz: 20.0

    # How long an intent stays live after the last command from behaviour or
    # teleop. Slightly longer than the arbiter's own staleness window, so the
    # guard does not release its veto a moment before the car actually stops.
    intent_timeout_s: 0.7

    # --- chatter (added 2026-09-01) ---
    # A single threshold on a noisy range estimate toggles every tick when an
    # object sits near it. Measured on the car: 16 stop/clear cycles in one
    # minute, which a 3 second command feels as being chopped into fragments.
    # Both of these only ever DELAY a release; the distance at which the guard
    # intervenes is unchanged, so neither can make it stop later than before.
    release_margin_m: 0.07    # a blocking sector must clear by this much extra
    min_block_s: 0.4          # and stay blocked at least this long

    # Returns closer than this are the vehicle seeing itself. 0.02 keeps the
    # original behaviour. On this chassis the LiDAR sits roughly 0.1 m from the
    # bodywork, so 0.10 is the value to use once you have physically identified
    # what is inside the envelope. Do not raise it blind: it is the difference
    # between ignoring your own cable and ignoring someone's foot.
    min_range_m: 0.02

    # --- override (added 2026-09-01) ---
    # The phone's "Lidar Guard" button toggles this at runtime. It is declared
    # here only to set the value the node BOOTS with, and that value should stay
    # true: a restart or a crash must never come back with the guard off.
    enabled_on_start: true
    disabled_warn_s: 10.0     # how often to say so while overridden

