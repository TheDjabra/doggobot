voice_bridge_node:
  ros__parameters:
    port: 8080

    # Manual driving ceiling, below the arbiter's 0.382, because a thumb on a
    # phone deserves less authority than a tuned autonomous behaviour.
    max_teleop_throttle: 0.38

    # Measured SMOOTH floor (tools/vesc_smoothness.py), not the start threshold.
    # The bridge steps small stick deflections up to this, because below it the
    # car judders instead of creeping.
    throttle_floor: 0.25
