# Deliberately timid follow settings, for a first run in an unfamiliar space or
# after a change that could destabilise the loop. Slowest speed the motor will
# sustain, reverse off so a target stepping toward the car cannot make it dart
# backwards, and gentle steering.
#
#   ros2 launch doggobot all.launch.py follow_config:=follow_firstrun.yaml
#
# UPDATED 2026-09-02. This file was written before the loop had ever run on the
# ground and before half_fov_deg was measured. It kept kp_steer at 0.6, which
# after that measurement is HOTTER than the tuned config in follow.yaml, so the
# "timid" file was the aggressive one. Steering and the camera gain are now set
# below what follow.yaml uses, which is what this file is for.
#
# Once the loop is seen to be stable, move to follow.yaml rather than raising
# values here.
follow_node:
  ros__parameters:
    kp_steer: 0.30      # follow.yaml uses 0.45; this is deliberately below it
    ki_steer: 0.0
    kd_steer: 0.15
    steer_deadband: 0.05
    max_steer: 0.7

    standoff_mm: 1000.0
    kp_throttle: 0.0004
    kd_throttle: 0.0001
    throttle_deadband_mm: 300.0   # wider than bench: less hunting on a first run
    throttle_floor: 0.365
    max_throttle: 0.382           # must be >= throttle_floor, or the floor
                                  # silently overrides the ceiling.
    allow_reverse: false          # one variable at a time
    max_reverse: 0.382

    target_timeout_s: 0.5

    # Camera cascade, also gentler than follow.yaml (0.85).
    use_pan: true
    half_fov_deg: 25.2            # measured, see follow.yaml for the method
    kp_pan: 0.60
    kd_pan: 0.05
    pan_anchor_to_measured: true
    capture_lag_s: 0.08
    debug_hz: 2.0
