stt_node:
  ros__parameters:
    # Must be under the bind-mounted repo dir; the container cannot see
    # /home/pi/models. Fetch with tools/get_vosk_model.sh on the Pi host.
    model_path: /home/projects/ros2_ws/src/doggobot/models/vosk-small-en

    # PortAudio device, matched by name substring so it survives the index
    # shifting when other USB devices come and go. Empty would mean the ALSA
    # default, which in this container is NOT the Samson.
    device: "Samson"

    sample_rate: 16000

    # Constrain recognition to the exact phrase list. In a lab with motors and
    # other teams talking this matters more than model quality: a fragment of
    # someone else's sentence cannot become a command, because those words are
    # not in the vocabulary. Set false for free-form, which the LLM tier wants.
    use_grammar: true

    min_words: 1

    # Run a second, unconstrained recogniser on the same audio, used ONLY when
    # the grammar produced nothing, and sent straight to the LLM.
    #
    # The grammar cannot emit words outside the command vocabulary, which is what
    # makes it reliable and also what makes it useless for the LLM tier: it can
    # never produce "for five seconds". This fills that gap without weakening the
    # fast path.
    #
    # The two transcripts are deliberately NOT merged. The keyword matcher is
    # substring-based, so a free-form "drive forward for five seconds then spin
    # left twice" contains "forward" and would match a plain forward primitive,
    # silently running a fragment of what was said.
    freeform: true
