behavior_node:
  ros__parameters:
    publish_hz: 20.0

    # Above the measured SMOOTH floor of 0.25 (tools/vesc_smoothness.py).
    # Anything under that jitters badly and draws ~5x the current, so "slow and
    # deliberate" is not available on this drivetrain: it is 0.25+ or stopped.
    cruise_throttle: 0.365
    reverse_throttle: 0.365

    # Held steering for circles. 0.7 matches the follow controller's ceiling and
    # sits inside the arbiter's 0.8 clamp, so a circle is the tightest arc the
    # car can actually drive.
    circle_steer: 0.7

    # Every moving primitive is time-bounded. "Forward until further notice" is
    # how a car ends up in a wall when a link drops. A command may override with
    # {"seconds": N}, capped at max_seconds.
    default_seconds: 3.0
    circle_seconds: 6.0
    max_seconds: 15.0

    # The on-robot mic listens continuously and the vocabulary is ordinary
    # English, so mic commands must be addressed to the car by name:
    #   "atlas forward"   "atlas circle left"   "atlas stop"
    # Observed 2026-08-26: without this, overheard conversation containing "back"
    # reversed the car mid-test.
    #
    # Phone speech is deliberately NOT in this list: holding the talk button is
    # already a deliberate act, and requiring the name there would only add
    # friction to the path that is already gated.
    wake_word: "atlas"
    wake_word_sources: ["onboard-mic"]

    # Colour test mode runs long because it is meant to be watched while tuning
    # thresholds. Still bounded: an open-ended reactive mode is exactly what
    # drives off a bench when you look away.
    color_react_seconds: 300.0

    # A held full-lock circle long enough to come back around. Geometry and
    # surface dependent (steering throw, wheelbase, grip), so measure it: drive
    # it, see where the nose ends up, adjust. 3 s is a starting guess.
    turn_around_seconds: 3.0

    # Three-point turn legs. Turns the car around in far less space than a
    # circle, which is what matters indoors: the car's Ackermann turning radius
    # is a physical constraint no gain can change, but a reverse leg sidesteps it.
    # All three are measured, not computed - drive it and adjust.
    three_point_forward_s: 1.6
    three_point_reverse_s: 1.6
    three_point_settle_s: 0.8

    # Dead-reckoning calibration, for "forward 1 metre" and "right 30 degrees".
    # Open-loop: the VESC reports a tachometer but the class actuator node holds
    # the port and publishes nothing, so wheel travel is unreadable while the
    # stack runs. Closing that loop means replacing that node.
    #
    # BOTH ARE MEASURED, not computed:
    #   metres_per_second  - run `forward` for a known time, tape-measure it
    #   degrees_per_second - run `turn_around`, see how far the nose swung
    # Both change with surface, slope and pack charge, so re-check at the venue.
    metres_per_second: 0.9
    degrees_per_second: 60.0
    max_metres: 8.0

    # --- camera pan axis (added 2026-08-30) ---
    # behavior_node is the sole /pan_cmd publisher, the same rule that keeps two
    # nodes off /cmd_vel. Priority is follow tracking > spoken look > recentre.
    pan_enabled: true
    pan_look_deg: 45.0          # where "atlas look left" puts the camera.
                                # Ceiling is +/-90 from centre, enforced in
                                # behavior_node, pan_node and the firmware.
    pan_centre_on_idle: true    # camera returns forward when nothing is tracked
    pan_publish_hz: 20.0

    # Escalation to a three-point turn when the camera is pinned and the chassis
    # cannot come round. OFF for the demo: it is the least-tested path in here,
    # and a surprise three-point turn in front of the class is worse than a wide
    # arc. Turn on only after it has been watched on the ground.
    pan_escalate: false
    pan_escalate_deg: 55.0
    pan_escalate_s: 2.5

    # --- MEASURED 2026-09-02, tape measure and timed turns ---
    # Forward: 1.0s->31in, 1.4s->40in, 1.8s->51in. Fitting distance = rate*time
    # + coast gives 0.635 m/s and 0.144 m, worst residual 0.7in over a 51in run.
    # The coast term is most of the error at indoor distances: dividing by a
    # rate alone, "forward 0.3 m" would travel 0.45 m.
    metres_per_second: 0.635
    coast_metres: 0.144
    # Turns: 2.0s->90deg, 4.0s->180deg. Linear, and NO coast, because the
    # arbiter zeroes steering at the end so the car coasts straight.
    degrees_per_second: 45.0
    turn_around_seconds: 4.0

    # --- search sweep (added 2026-09-02) ---
    # When a follow lock is lost, wait, then sweep the camera to find the target
    # again, starting toward the side it was last seen on.
    #
    # The sweep is only half of it. perception clears want_lock when a target is
    # REMOVED (relock_on_loss: false), so search re-requests the lock; without
    # that it would sweep past the person and never latch on, and would look
    # exactly like a camera that is working.
    search_enabled: true
    # A lock often drops for a fraction of a second when someone turns or is
    # briefly occluded. Sweeping instantly would pull the camera off a target
    # that was about to come back.
    search_delay_s: 2.0
    # Full travel. Was +/-45 while a mechanical bind limited the mount; that was
    # cleared 2026-09-02. Clamped to the axis ceiling in code, so a larger value
    # here cannot drive the camera past what the firmware allows.
    search_range_deg: 90.0
    search_speed_deg_s: 35.0    # slow enough that the detector still sees
    search_timeout_s: 30.0      # then give up, release the lock, look forward

