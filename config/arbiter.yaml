arbiter_node:
  ros__parameters:
    publish_hz: 20.0

    # A source that stops publishing stops winning. Teleop and safety are tight
    # because they are streamed; behaviour is looser because a primitive may
    # legitimately think between commands.
    safety_timeout_s: 0.5
    teleop_timeout_s: 0.5
    behavior_timeout_s: 1.0

    # Ceilings. Nothing may command more than this, whatever it asks for.
    #
    # max_steering is in the same [-1, 1] space the VESC node maps to servo
    # [0, 1], so 0.8 matches the car's calibrated steering limit exactly.
    #
    # Throttle. vesc_twist_node caps itself at 0.382 * 20000 = 7640 ERPM and
    # then commands rpm = 7640 * linear.x, so linear.x is a fraction of that.
    # The class's own lane_guidance_node publishes 0.363 to 0.382, i.e. the car
    # is calibrated to drive at roughly 2800 ERPM. 0.382 matches that ceiling.
    #
    # throttle_floor is MEASURED, not guessed (tools/vesc_probe.py, 2026-08-25):
    # 500 ERPM does not start the motor, 1000 does. So below linear.x ~= 0.13
    # the car does not move at all. Behaviours must step over this floor rather
    # than ramping smoothly to zero.
    max_steering: 0.8
    max_throttle: 0.382
    # MEASURED 2026-08-26 with tools/vesc_smoothness.py, and this replaces the
    # earlier 0.13. That number was where the motor STARTS; this is where it runs
    # SMOOTHLY, which is a different and higher threshold. Below 0.25 the FOC
    # speed loop cannot hold a setpoint: commanded 993 ERPM it wandered over a
    # 1676 ERPM range while drawing 14.6 A, against 3.0 A at cruise. Jumpy motion
    # and five times the current, for no useful speed.
    throttle_floor: 0.365
