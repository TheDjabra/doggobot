perception_node:
  ros__parameters:
    # Generated by tools/make_nn_archive.py around the 5-shave blob. Absolute so
    # it resolves the same whether launched or run directly.
    archive_path: /home/projects/ros2_ws/src/doggobot/models/person-yolo11n-416.tar.xz

    confidence: 0.5

    # Requested from the camera. The pipeline actually delivers ~12 fps once
    # stereo and the tracker are stacked on; asking for more costs nothing and
    # omitting it entirely collapses the pipeline to about 1 fps.
    nn_fps: 20.0

    # Host-side median on Z. Stereo depth is noisy frame to frame and the
    # on-device median filter had to be disabled (SIPP memory).
    depth_window: 5

    # Acquire a lock as soon as someone is in frame, without waiting for a
    # command. Useful for bench testing; false for the real demo, where locking
    # is a deliberate act.
    lock_on_start: false

    max_objects: 10

    # After REMOVED, do NOT silently grab the next best target. Losing a lock is
    # something the operator is told about. (Observed 2026-08-26: with this on,
    # stepping out of frame and back locked onto a different target with no
    # announcement.) The pan-servo sweep will re-lock explicitly instead.
    relock_on_loss: false

    # Video for the phone. Encoded only when something is subscribed, and well
    # below the pipeline rate, because JPEG encoding competes with the control
    # loop for the same Pi cores.
    video_fps: 8.0
    video_quality: 55
    video_annotate: true

    # Colour cues for the mission statement. Runs on the same frames the video
    # uses, because only one process can own the camera.
    color_enabled: true
    color_config_path: /home/projects/ros2_ws/src/doggobot/config/color_thresholds.json
    color_hz: 5.0
    # '' none, 'green'/'red' one mask, 'all' both. Tints matching pixels on the
    # video feed so thresholds can be tuned by eye from the phone.
    color_view: ""
