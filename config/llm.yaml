llm_node:
  ros__parameters:
    # Self-hosted, not a cloud API. Any machine reachable from the car will do:
    # ours is a desktop on the same Tailscale network, named here by its MagicDNS
    # name. Point this at your own Ollama host. Nothing else in the stack depends
    # on it, and with it unreachable the offline keyword path still works.
    host: "http://rasputin:11434"

    # 7B at Q4 is ~4.5 GB, comfortable on 8 GB VRAM. The schema does the hard
    # part, so this only has to map words onto an enum that already exists.
    model: "qwen2.5:7b-instruct"

    # Warm inference measured at 0.34 s on the RTX 3070, so this is generous by a
    # wide margin. If it times out the utterance is dropped and the car behaves
    # as it does with no LLM at all.
    timeout_s: 20.0

    # Keep the model resident in VRAM. Measured cold load: 50.9 s for 4.7 GB;
    # warm: 0.34 s. The model is not slow, it is unloaded, and Ollama's 5 minute
    # default would evict it between demo commands.
    #
    # Ollama parses a STRING as a Go duration ("30m", "24h") and a NUMBER as
    # seconds, where -1 means never evict. "-1" as a string fails with
    # `missing unit in duration`, so the node converts numeric-looking values to
    # a JSON number before sending.
    keep_alive: "-1"

    # Load it at startup so the first real command never pays the cold cost.
    warm_on_start: true

    # A parsed sequence longer than this is more likely a model that has run away
    # than something a person actually said.
    max_steps: 8
