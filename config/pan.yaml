pan_node:
  ros__parameters:
    # By-id, NOT /dev/ttyUSB0: the LD06 LiDAR already claims ttyUSB0 on this Pi
    # and USB enumeration order is not a promise. Install the udev rule first:
    #   sudo cp deploy/99-doggobot-serial.rules /etc/udev/rules.d/
    #   sudo udevadm control --reload && sudo udevadm trigger
    port: /dev/doggobot-pan
    # The board fitted to the car has native USB, so it enumerates as ttyACM,
    # not ttyUSB. Used only if the udev rule is not installed yet.
    fallback_port: /dev/ttyACM1
    baud: 115200

    # Which way the servo faces is a property of the mount, not the code.
    # Set this once the bracket is on: command "look right" and see which way it
    # goes. Getting it wrong makes the follow cascade diverge, not wander.
    invert: false
    # ZERO IS IN THE SERVO, not here. The horn was 128 deg off encoder centre,
    # which left only ~52 deg of travel on one side before the count wrapped, so
    # it was calibrated into EEPROM instead (pan_console 'z' -> CalibrationOfs),
    # verified 2026-09-01: 128.06 -> 0.00. This stays 0 and is fine trim only.
    centre_offset_deg: 0.0

    # TRAVEL CEILING: +/-90 degrees from centre, never more. Operator
    # instruction 2026-09-01. This value may be lowered but a value above 90 is
    # clamped and logged as an error by pan_node, and the firmware rejects one
    # above 90 at compile time.
    limit_deg: 90.0                 # matches the firmware clamp and the ceiling
    slew_deg_s: 200.0               # measured ceiling is ~120; this is a request
    publish_hz: 20.0
    stale_s: 0.5
    min_command_delta_deg: 0.4      # do not spend a bus round trip on noise
    reconnect_s: 2.0
